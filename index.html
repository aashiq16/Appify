<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catch The Spider</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #000;
    cursor: crosshair;
}


/* =========================================================
   MAIN SCENE
========================================================= */

.scene {
    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: #000;
}

.scene.page-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}


/* =========================================================
   BACKGROUND
========================================================= */

.background {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center;

    z-index: 1;

    user-select: none;
    pointer-events: none;
}


/* =========================================================
   CENTER MASK
========================================================= */

.center-mask {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 150px;
    height: 150px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0, 0, 0, .96) 0%,
            rgba(0, 0, 0, .90) 35%,
            rgba(0, 0, 0, .55) 65%,
            rgba(0, 0, 0, 0) 100%
        );

    z-index: 2;

    pointer-events: none;
}


/* =========================================================
   RED ATMOSPHERE
========================================================= */

.red-atmosphere {
    position: absolute;

    inset: 0;

    z-index: 3;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at 0% 80%,
            rgba(130, 0, 10, .12),
            transparent 38%
        ),

        radial-gradient(
            ellipse at 100% 70%,
            rgba(130, 0, 10, .10),
            transparent 40%
        );

    mix-blend-mode: screen;
}


/* =========================================================
   CATCH THE SPIDER TITLE
========================================================= */

.catch-title {
    position: absolute;

    left: 50%;
    top: 25%;

    width: 760px;
    height: 150px;

    transform: translateX(-50%);

    z-index: 8;

    pointer-events: none;

    overflow: visible;
}

.catch-title svg {
    width: 100%;
    height: 100%;

    overflow: visible;
}


/* =========================================================
   TITLE TEXT
========================================================= */

.title-white {
    fill: #ffffff;
}

.title-red {
    fill: #d40000;
}


/* =========================================================
   MAIN FONT
========================================================= */

.catch-title text,
.congratulations-title text,
.caught-message {

    font-family:
        Arial Black,
        Impact,
        sans-serif;

    font-weight: 900;
}


/* =========================================================
   CATCH TITLE FONT
========================================================= */

.catch-title text {

    font-size: 54px;

    letter-spacing: 2px;
}


/* =========================================================
   CONGRATULATIONS CONTAINER
========================================================= */

.congratulations-title {

    position: absolute;

    left: 50%;
    top: 25%;

    width: 900px;
    height: 230px;

    transform: translateX(-50%);

    z-index: 30;

    pointer-events: auto;
    cursor: pointer;

    overflow: visible;

    opacity: 0;

    visibility: hidden;
}


/* =========================================================
   SHOW CONGRATULATIONS
========================================================= */

.congratulations-title.show {

    opacity: 1;

    visibility: visible;

    animation:
        congratulationsIn .7s ease-out forwards;
}


/* =========================================================
   CONGRATULATIONS SVG
========================================================= */

.congratulations-title svg {

    width: 100%;
    height: 150px;

    overflow: visible;
}


/* =========================================================
   CONGRATULATIONS FONT
========================================================= */

.congratulations-title text {

    font-size: 54px;

    letter-spacing: 2px;
}


/* =========================================================
   STRAIGHT MESSAGE
========================================================= */

.caught-message {

    position: absolute;

    left: 50%;
    top: 135px;

    transform: translateX(-50%);

    width: 100%;

    text-align: center;

    white-space: nowrap;

    font-size: 28px;

    font-weight: 900;

    letter-spacing: 1px;

    color: #d40000;

    text-shadow:
        0 2px 0 #ffffff;

    opacity: 0;

    animation:
        messageIn .6s ease-out .25s forwards;
}


/* =========================================================
   CONGRATULATIONS ANIMATION
========================================================= */

@keyframes congratulationsIn {

    0% {

        opacity: 0;

        transform:
            translateX(-50%)
            scale(.75);
    }

    70% {

        transform:
            translateX(-50%)
            scale(1.05);
    }

    100% {

        opacity: 1;

        transform:
            translateX(-50%)
            scale(1);
    }
}


/* =========================================================
   MESSAGE ANIMATION
========================================================= */

@keyframes messageIn {

    0% {

        opacity: 0;

        transform:
            translateX(-50%)
            translateY(10px);
    }

    100% {

        opacity: 1;

        transform:
            translateX(-50%)
            translateY(0);
    }
}


/* =========================================================
   SPIDER
========================================================= */

.spider {

    position: absolute;

    width: 125px;
    height: 125px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        rotate(0deg);

    transform-origin: center;

    z-index: 10;

    pointer-events: none;

    will-change:
        left,
        top,
        transform;

    filter:
        drop-shadow(
            0 2px 2px rgba(0, 0, 0, .9)
        )

        drop-shadow(
            0 0 5px rgba(255, 255, 255, .15)
        );

    transition:
        opacity .35s ease,
        filter .35s ease;
}


/* =========================================================
   CAUGHT SPIDER
========================================================= */

.spider.caught {

    opacity: 0;

    filter:
        drop-shadow(
            0 0 20px rgba(255, 0, 0, .8)
        );

    pointer-events: none;
}


/* =========================================================
   SPIDER SVG
========================================================= */

.spider-svg {

    width: 100%;
    height: 100%;

    overflow: visible;
}


/* =========================================================
   SPIDER LEGS
========================================================= */

.leg {

    fill: none;

    stroke: #f5f5f5;

    stroke-width: 5;

    stroke-linecap: round;
    stroke-linejoin: round;
}

.leg-hair {

    fill: none;

    stroke: #fff;

    stroke-width: 1;

    stroke-linecap: round;

    opacity: .65;
}


/* =========================================================
   SPIDER BODY
========================================================= */

.body {

    fill: #f4f4f4;

    stroke: #fff;

    stroke-width: 1;
}

.body-dark {

    fill: #080808;

    opacity: .62;
}

.body-highlight {

    fill: #fff;

    opacity: .55;
}


/* =========================================================
   EYES
========================================================= */

.eye {
    fill: #050505;
}


/* =========================================================
   LEG GROUPS
========================================================= */

.leg-group {

    transform-box: fill-box;

    transform-origin: center;
}


/* =========================================================
   WALKING ANIMATION
========================================================= */

.walking .group-a {

    animation:
        stepA .38s ease-in-out infinite;
}

.walking .group-b {

    animation:
        stepB .38s ease-in-out infinite;
}


/* =========================================================
   WALK A
========================================================= */

@keyframes stepA {

    0% {
        transform:
            translate(0, 0)
            rotate(0deg);
    }

    20% {
        transform:
            translate(-4px, -6px)
            rotate(-4deg);
    }

    45% {
        transform:
            translate(-8px, -9px)
            rotate(-7deg);
    }

    65% {
        transform:
            translate(5px, 3px)
            rotate(4deg);
    }

    100% {
        transform:
            translate(0, 0)
            rotate(0deg);
    }
}


/* =========================================================
   WALK B
========================================================= */

@keyframes stepB {

    0% {
        transform:
            translate(0, 0)
            rotate(0deg);
    }

    20% {
        transform:
            translate(5px, 3px)
            rotate(4deg);
    }

    45% {
        transform:
            translate(8px, 7px)
            rotate(7deg);
    }

    65% {
        transform:
            translate(-5px, -3px)
            rotate(-4deg);
    }

    100% {
        transform:
            translate(0, 0)
            rotate(0deg);
    }
}


/* =========================================================
   BODY BOUNCE
========================================================= */

.walking .body-container {

    animation:
        bodyBounce .38s ease-in-out infinite;
}

@keyframes bodyBounce {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-2px);
    }
}


/* =========================================================
   IDLE MOVEMENT
========================================================= */

.idle .body-container {

    animation:
        idle .8s ease-in-out infinite alternate;
}

@keyframes idle {

    from {
        transform:
            translateY(0);
    }

    to {
        transform:
            translateY(-1px);
    }
}


/* =========================================================
   CLICK EFFECT
========================================================= */

.click-point {

    position: absolute;

    width: 7px;
    height: 7px;

    border:
        1px solid
        rgba(255, 255, 255, .7);

    border-radius: 50%;

    transform:
        translate(-50%, -50%)
        scale(0);

    z-index: 20;

    pointer-events: none;

    animation:
        clickPulse .6s ease-out forwards;
}

@keyframes clickPulse {

    0% {

        transform:
            translate(-50%, -50%)
            scale(0);

        opacity: .9;
    }

    100% {

        transform:
            translate(-50%, -50%)
            scale(5);

        opacity: 0;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .spider {

        width: 90px;
        height: 90px;
    }


    .center-mask {

        width: 110px;
        height: 110px;
    }


    .catch-title {

        width: 95vw;
        height: 120px;

        top: 27%;
    }


    .catch-title text {

        font-size: 34px;

        letter-spacing: 1px;
    }


    .congratulations-title {

        width: 100vw;

        height: 200px;

        top: 27%;
    }


    .congratulations-title svg {

        height: 120px;
    }


    .congratulations-title text {

        font-size: 32px;

        letter-spacing: 1px;
    }


    .caught-message {

        top: 110px;

        font-size: 20px;

        letter-spacing: .5px;
    }

}


/* =========================================================
   TREASURE PAGE
========================================================= */

.treasure-page {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 100;
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .7s ease, visibility .7s ease;
    background: #07131b;
}

.treasure-page.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.treasure-sky {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 78% 12%, rgba(255,235,170,.95) 0 42px, rgba(255,235,170,.18) 43px 120px, transparent 121px),
        linear-gradient(to bottom, #07131b 0%, #102936 38%, #174957 55%, #c78e4e 56%, #e8c47c 100%);
}

.treasure-stars {
    position: absolute;
    inset: 0;
    opacity: .5;
    background-image:
        radial-gradient(circle at 12% 15%, #fff 0 1px, transparent 2px),
        radial-gradient(circle at 28% 9%, #fff 0 1px, transparent 2px),
        radial-gradient(circle at 44% 20%, #fff 0 1px, transparent 2px),
        radial-gradient(circle at 62% 10%, #fff 0 1px, transparent 2px),
        radial-gradient(circle at 90% 25%, #fff 0 1px, transparent 2px);
    background-size: 220px 160px;
}

.treasure-ocean {
    position: absolute;
    left: 0;
    right: 0;
    top: 42%;
    height: 23%;
    background: linear-gradient(to bottom, #176f83, #073b4a);
    overflow: hidden;
}

.treasure-ocean::before,
.treasure-ocean::after {
    content: '';
    position: absolute;
    left: -10%;
    width: 120%;
    height: 100px;
    border-top: 2px solid rgba(255,255,255,.3);
    border-radius: 50%;
}

.treasure-ocean::before { top: 25px; transform: rotate(2deg); }
.treasure-ocean::after { top: 95px; transform: rotate(-2deg); opacity: .5; }

.treasure-sand {
    position: absolute;
    left: -5%;
    right: -5%;
    bottom: -12%;
    height: 48%;
    transform: rotate(-2deg);
    background:
        radial-gradient(circle at 18% 32%, rgba(90,55,20,.2) 0 2px, transparent 3px),
        radial-gradient(circle at 47% 55%, rgba(90,55,20,.16) 0 2px, transparent 3px),
        radial-gradient(circle at 75% 28%, rgba(255,255,255,.22) 0 2px, transparent 3px),
        linear-gradient(120deg, #bc8342, #f0cf88 45%, #d3a05a 100%);
}

.treasure-title {
    position: absolute;
    z-index: 20;
    top: 7%;
    left: 50%;
    transform: translateX(-50%) rotate(-2deg);
    width: 92vw;
    text-align: center;
}

.treasure-title h1 {
    font-family: Impact, 'Arial Black', sans-serif;
    font-size: clamp(42px, 7vw, 86px);
    letter-spacing: 3px;
    color: #d40000;
    text-shadow: 4px 5px 0 #fff, 0 0 24px rgba(212,0,0,.35);
}

.treasure-title p {
    margin-top: 10px;
    color: #fff;
    font: 18px Georgia, serif;
    text-shadow: 0 2px 7px #000;
}

.treasure-sign {
    position: absolute;
    z-index: 25;
    left: 7%;
    top: 27%;
    width: min(350px, 38vw);
    padding: 22px 25px;
    background: linear-gradient(145deg, #75421f, #43230f);
    border: 6px solid #291509;
    border-radius: 8px;
    transform: rotate(-4deg);
    box-shadow: 0 18px 30px rgba(0,0,0,.45);
}

.treasure-sign h2 {
    color: #ffd75a;
    font: 900 clamp(25px, 3vw, 43px) Impact, 'Arial Black', sans-serif;
    text-align: center;
    letter-spacing: 2px;
    text-shadow: 2px 3px 0 #291509;
}

.treasure-sign p {
    margin-top: 10px;
    color: #fff4d4;
    font: 17px/1.45 Georgia, serif;
    text-align: center;
}

.palm {
    position: absolute;
    z-index: 18;
    right: 1%;
    bottom: 8%;
    width: 300px;
    height: 470px;
}

.palm-trunk {
    position: absolute;
    right: 120px;
    bottom: 0;
    width: 42px;
    height: 385px;
    border-radius: 45%;
    background: repeating-linear-gradient(-8deg, #4d2e18 0 18px, #714421 19px 28px);
    transform: rotate(9deg);
    box-shadow: 5px 5px 14px rgba(0,0,0,.35);
}

.palm-leaves {
    position: absolute;
    right: 55px;
    top: 28px;
    width: 260px;
    height: 180px;
}

.palm-leaf {
    position: absolute;
    left: 100px;
    top: 75px;
    width: 190px;
    height: 26px;
    transform-origin: 0 50%;
    border-radius: 100% 10% 100% 10%;
    background: linear-gradient(to right, #173d21, #43833c, #1b5729);
}

.palm-leaf:nth-child(1) { transform: rotate(-72deg); }
.palm-leaf:nth-child(2) { transform: rotate(-50deg); }
.palm-leaf:nth-child(3) { transform: rotate(-25deg); }
.palm-leaf:nth-child(4) { transform: rotate(3deg); }
.palm-leaf:nth-child(5) { transform: rotate(28deg); }
.palm-leaf:nth-child(6) { transform: rotate(52deg); }

.treasure-rock {
    position: absolute;
    z-index: 20;
    background: linear-gradient(145deg, #6c6c63, #353731 70%, #22241f);
    clip-path: polygon(0 72%, 10% 38%, 35% 12%, 67% 0, 92% 28%, 100% 72%, 72% 100%, 20% 96%);
    box-shadow: 0 15px 20px rgba(0,0,0,.3);
}

.rock-one { width: 210px; height: 125px; left: 2%; bottom: 5%; }
.rock-two { width: 145px; height: 90px; left: 38%; bottom: 8%; }

.hidden-treasure {
    position: absolute;
    z-index: 30;
    left: 55%;
    bottom: 16%;
    width: 185px;
    height: 145px;
    transform: translateX(-50%);
    cursor: pointer;
    transition: transform .3s ease;
}

.hidden-treasure:hover { transform: translateX(-50%) scale(1.05); }

.chest-body {
    position: absolute;
    bottom: 0;
    width: 185px;
    height: 92px;
    border: 8px solid #2d180b;
    border-radius: 8px 8px 16px 16px;
    background: repeating-linear-gradient(90deg, #603516 0 18px, #865021 19px 29px);
    box-shadow: inset 0 10px 15px rgba(255,255,255,.08), 0 18px 30px rgba(0,0,0,.45);
}

.chest-lid {
    position: absolute;
    z-index: 2;
    left: 0;
    top: 10px;
    width: 185px;
    height: 72px;
    border: 8px solid #2d180b;
    border-radius: 90px 90px 8px 8px;
    background: repeating-linear-gradient(90deg, #69401c 0 18px, #915624 19px 29px);
    transform-origin: bottom;
    transition: transform .7s cubic-bezier(.2,.8,.2,1);
}

.chest-lock {
    position: absolute;
    z-index: 5;
    left: 77px;
    top: 61px;
    width: 32px;
    height: 43px;
    border: 4px solid #6e470f;
    border-radius: 5px;
    background: #d5a22e;
}

.gold {
    position: absolute;
    z-index: 1;
    left: 27px;
    top: 4px;
    width: 135px;
    height: 75px;
    opacity: 0;
    transition: opacity .4s .35s;
}

.coin {
    position: absolute;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, #fff8a0, #e8b72e 48%, #8c5b0d);
    border: 2px solid #744a08;
}

.coin:nth-child(1){left:0;top:32px}.coin:nth-child(2){left:27px;top:7px}.coin:nth-child(3){left:54px;top:30px}.coin:nth-child(4){left:84px;top:5px}.coin:nth-child(5){left:103px;top:38px}

.hidden-treasure.found .chest-lid { transform: rotateX(-110deg); }
.hidden-treasure.found .gold { opacity: 1; }

.treasure-hint {
    position: absolute;
    z-index: 40;
    bottom: 4%;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 24px;
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 30px;
    background: rgba(20,12,6,.65);
    color: #fff0bd;
    font: 600 14px Arial, sans-serif;
    letter-spacing: 1px;
    backdrop-filter: blur(8px);
}

@media(max-width:600px){
    .treasure-sign{left:4%;top:28%;width:60vw}
    .palm{right:-95px;transform:scale(.7) rotate(5deg);transform-origin:bottom right}
    .hidden-treasure{left:55%;bottom:15%;transform:translateX(-50%) scale(.78)}
    .hidden-treasure:hover{transform:translateX(-50%) scale(.83)}
    .treasure-title{top:6%}
}

</style>

</head>


<body>


<div
    class="scene"
    id="scene"
>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<img
    class="background"
    src="web-background.png"
    alt=""
>


<!-- =====================================================
     CENTER MASK
===================================================== -->

<div class="center-mask"></div>


<!-- =====================================================
     RED ATMOSPHERE
===================================================== -->

<div class="red-atmosphere"></div>


<!-- =====================================================
     CATCH THE SPIDER
===================================================== -->

<div
    class="catch-title"
    id="catchTitle"
>

    <svg
        viewBox="0 0 760 150"
        xmlns="http://www.w3.org/2000/svg"
    >

        <defs>

            <path
                id="titleCurve"
                d="M 70 100 Q 380 5 690 100"
            />

        </defs>


        <!-- WHITE LOWER EDGE -->

        <text
            class="title-white"
            dy="5"
        >

            <textPath
                href="#titleCurve"
                startOffset="50%"
                text-anchor="middle"
            >
                CATCH THE SPIDER
            </textPath>

        </text>


        <!-- RED MAIN TEXT -->

        <text
            class="title-red"
        >

            <textPath
                href="#titleCurve"
                startOffset="50%"
                text-anchor="middle"
            >
                CATCH THE SPIDER
            </textPath>

        </text>

    </svg>

</div>


<!-- =====================================================
     CONGRATULATIONS
===================================================== -->

<div
    class="congratulations-title"
    id="congratulationsTitle"
>

    <svg
        viewBox="0 0 900 170"
        xmlns="http://www.w3.org/2000/svg"
    >

        <defs>

            <path
                id="congratulationsCurve"
                d="M 70 105 Q 450 5 830 105"
            />

        </defs>


        <!-- =================================================
             WHITE LOWER EDGE
        ================================================= -->

        <text
            class="title-white"
            dy="5"
        >

            <textPath
                href="#congratulationsCurve"
                startOffset="50%"
                text-anchor="middle"
            >
                Congratulations!
            </textPath>

        </text>


        <!-- =================================================
             RED MAIN TEXT
        ================================================= -->

        <text
            class="title-red"
        >

            <textPath
                href="#congratulationsCurve"
                startOffset="50%"
                text-anchor="middle"
            >
                Congratulations!
            </textPath>

        </text>

    </svg>


    <!-- =================================================
         STRAIGHT MESSAGE
    ================================================= -->

    <div class="caught-message">
        you caught the spider!
    </div>

</div>


<!-- =====================================================
     SPIDER
===================================================== -->

<div
    class="spider idle"
    id="spider"
>

<svg
    class="spider-svg"
    viewBox="0 0 400 400"
    xmlns="http://www.w3.org/2000/svg"
>


<defs>

    <filter id="spiderTexture">

        <feTurbulence
            type="fractalNoise"
            baseFrequency=".06"
            numOctaves="2"
            seed="12"
            result="noise"
        />

        <feDisplacementMap
            in="SourceGraphic"
            in2="noise"
            scale="1.5"
        />

    </filter>

</defs>


<!-- =====================================================
     BACK LEFT LEG
===================================================== -->

<g class="leg-group group-a">

    <path
        class="leg"
        d="
            M188 190
            C160 165
            125 125
            90 82
            C65 52
            45 30
            22 14
        "
    />

    <path
        class="leg-hair"
        d="
            M90 82 L72 72
            M65 52 L50 44
            M45 30 L32 25
        "
    />

</g>


<!-- =====================================================
     LEFT SECOND LEG
===================================================== -->

<g class="leg-group group-b">

    <path
        class="leg"
        d="
            M184 204
            C145 190
            108 165
            70 140
            C43 122
            22 108
            7 98
        "
    />

</g>


<!-- =====================================================
     LEFT THIRD LEG
===================================================== -->

<g class="leg-group group-a">

    <path
        class="leg"
        d="
            M180 220
            C140 218

     PAGE 2 — FIND THE TREASURE
===================================================== -->

<div
    class="treasure-page"
    id="treasurePage"
>

    <div class="treasure-sky"></div>
    <div class="treasure-stars"></div>
    <div class="treasure-ocean"></div>
    <div class="treasure-sand"></div>

    <div class="treasure-title">
        <h1>FIND THE TREASURE</h1>
        <p>Somewhere on this island, a hidden treasure awaits...</p>
    </div>

    <div class="treasure-sign">
        <h2>TREASURE HUNT</h2>
        <p>Search the island carefully.<br>Click the hidden treasure chest when you find it!</p>
    </div>

    <div class="palm">
        <div class="palm-trunk"></div>
        <div class="palm-leaves">
            <div class="palm-leaf"></div>
            <div class="palm-leaf"></div>
            <div class="palm-leaf"></div>

            <div class="palm-leaf"></div>
            <div class="palm-leaf"></div>
        </div>
    </div>

    <div class="treasure-rock rock-one"></div>
    <div class="treasure-rock rock-two"></div>

    <div
        class="hidden-treasure"
        id="hiddenTreasure"
        onclick="openTreasure(event)"
    >
        <div class="gold">
            <div class="coin"></div>
            <div class="coin"></div>
            <div class="coin"></div>
            <div class="coin"></div>
            <div class="coin"></div>
        </div>
        <div class="chest-lid"></div>
        <div class="chest-body"></div>
        <div class="chest-lock"></div>
    </div>

    <div class="treasure-hint">
        🔎 Find the hidden treasure
    </div>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const scene =
    document.getElementById("scene");

const spider =
    document.getElementById("spider");

const catchTitle =
    document.getElementById("catchTitle");

const congratulationsTitle =
    document.getElementById(
        "congratulationsTitle"
    );

const treasurePage =
    document.getElementById("treasurePage");

const hiddenTreasure =
    document.getElementById("hiddenTreasure");


/* =========================================================
   SPIDER POSITION
========================================================= */

let spiderX =
    window.innerWidth / 2;

let spiderY =
    window.innerHeight / 2;


/* =========================================================
   GAME STATE
========================================================= */

let attempts = 0;

let gameOver = false;

let movementTimer = null;


/*
   Random catch attempt:
   3, 4, 5 or 6
*/

const catchAttempt =
    Math.floor(
        Math.random() * 4
    ) + 3;


/* =========================================================
   INITIAL POSITION
========================================================= */

window.addEventListener(
    "load",
    () => {

        spider.style.left =
            spiderX + "px";

        spider.style.top =
            spiderY + "px";

    }
);


/* =========================================================
   CLICK EFFECT
========================================================= */

function createClickEffect(
    x,
    y
){

    const point =
        document.createElement(
            "div"
        );

    point.className =
        "click-point";

    point.style.left =
        x + "px";

    point.style.top =
        y + "px";

    scene.appendChild(
        point
    );

    setTimeout(
        () => point.remove(),
        650
    );

}


/* =========================================================
   MOVE SPIDER AWAY
========================================================= */

function moveSpiderAway(
    clickX,
    clickY
){

    const spiderRect =
        spider.getBoundingClientRect();


    const spiderCenterX =
        spiderRect.left +
        spiderRect.width / 2;


    const spiderCenterY =
        spiderRect.top +
        spiderRect.height / 2;


    /* -----------------------------------------------
       ESCAPE DIRECTION
    ----------------------------------------------- */

    let dx =
        spiderCenterX -
        clickX;


    let dy =
        spiderCenterY -
        clickY;


    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    /* -----------------------------------------------
       RANDOM DIRECTION IF CENTER CLICK
    ----------------------------------------------- */

    if(length < 1){

        const randomAngle =
            Math.random() *
            Math.PI *
            2;


        dx =
            Math.cos(
                randomAngle
            );


        dy =
            Math.sin(
                randomAngle
            );

    }

    else{

        dx /= length;

        dy /= length;

    }


    /* -----------------------------------------------
       ESCAPE DISTANCE
    ----------------------------------------------- */

    const escapeDistance =
        250 +
        Math.random() * 150;


    let targetX =
        spiderCenterX +
        dx *
        escapeDistance;


    let targetY =
        spiderCenterY +
        dy *
        escapeDistance;


    /* -----------------------------------------------
       SCREEN BOUNDARIES
    ----------------------------------------------- */

    const margin = 75;


    targetX =
        Math.max(
            margin,
            Math.min(
                window.innerWidth -
                margin,
                targetX
            )
        );


    targetY =
        Math.max(
            margin,
            Math.min(
                window.innerHeight -
                margin,
                targetY
            )
        );


    /* -----------------------------------------------
       DISTANCE
    ----------------------------------------------- */

    const moveX =
        targetX -
        spiderX;


    const moveY =
        targetY -
        spiderY;


    const distance =
        Math.sqrt(
            moveX * moveX +
            moveY * moveY
        );


    /* -----------------------------------------------
       ROTATION
    ----------------------------------------------- */

    let angle =
        Math.atan2(
            moveY,
            moveX
        )
        *
        180 /
        Math.PI;


    angle += 90;


    /* -----------------------------------------------
       MOVEMENT SPEED
    ----------------------------------------------- */

    const duration =
        Math.max(
            300,
            Math.min(
                1800,
                distance * 1.8
            )
        );


    /* -----------------------------------------------
       WALKING
    ----------------------------------------------- */

    spider.classList.remove(
        "idle"
    );

    spider.classList.add(
        "walking"
    );


    spider.style.transition =

    `
    left ${duration}ms cubic-bezier(.45,.05,.35,1),
    top ${duration}ms cubic-bezier(.45,.05,.35,1),
    transform ${duration}ms cubic-bezier(.45,.05,.35,1)
    `;


    spider.style.left =
        targetX + "px";


    spider.style.top =
        targetY + "px";


    spider.style.transform =

    `
    translate(-50%,-50%)
    rotate(${angle}deg)
    `;


    spiderX =
        targetX;


    spiderY =
        targetY;


    /* -----------------------------------------------
       STOP WALKING
    ----------------------------------------------- */

    clearTimeout(
        movementTimer
    );


    movementTimer =
        setTimeout(
            () => {

                if(!gameOver){

                    spider.classList.remove(
                        "walking"
                    );

                    spider.classList.add(
                        "idle"
                    );

                }

            },
            duration
        );

}


/* =========================================================
   CATCH SPIDER
========================================================= */

function catchSpider(){

    gameOver = true;


    clearTimeout(
        movementTimer
    );


    /* -----------------------------------------------
       STOP SPIDER
    ----------------------------------------------- */

    spider.classList.remove(
        "walking"
    );


    spider.classList.add(
        "caught"
    );


    /* -----------------------------------------------
       HIDE CATCH TITLE
    ----------------------------------------------- */

    catchTitle.style.opacity =
        "0";


    catchTitle.style.visibility =
        "hidden";


    /* -----------------------------------------------
       SHOW CONGRATULATIONS
    ----------------------------------------------- */

    setTimeout(
        () => {

            congratulationsTitle.classList.add(
                "show"
            );

        },
        300
    );

}


/* =========================================================
   MAIN CLICK HANDLER
========================================================= */

scene.addEventListener(
    "click",
    function(event){

        /* ---------------------------------------------
           GAME FINISHED
        --------------------------------------------- */

        if(gameOver){
            return;
        }


        const clickX =
            event.clientX;


        const clickY =
            event.clientY;


        /* ---------------------------------------------
           SPIDER BOUNDING BOX
        --------------------------------------------- */

        const spiderRect =
            spider.getBoundingClientRect();


        const spiderCenterX =
            spiderRect.left +
            spiderRect.width / 2;


        const spiderCenterY =
            spiderRect.top +
            spiderRect.height / 2;


        /* ---------------------------------------------
           DISTANCE FROM SPIDER
        --------------------------------------------- */

        const distanceFromSpider =
            Math.sqrt(

                Math.pow(
                    clickX -
                    spiderCenterX,
                    2
                )

                +

                Math.pow(
                    clickY -
                    spiderCenterY,
                    2
                )

            );


        /*
           Only a click on the spider
           counts as an attempt.
        */

        if(

            distanceFromSpider >
            Math.max(
                spiderRect.width,
                spiderRect.height
            ) / 2

        ){

            return;

        }


        /* ---------------------------------------------
           COUNT ATTEMPT
        --------------------------------------------- */

        attempts++;


        createClickEffect(
            clickX,
            clickY
        );


        /* ---------------------------------------------
           CATCH
        --------------------------------------------- */

        if(
            attempts >=
            catchAttempt
        ){

            catchSpider();

            return;

        }


        /* ---------------------------------------------
           ESCAPE
        --------------------------------------------- */

        moveSpiderAway(
            clickX,
            clickY
        );

    }
);


/* =========================================================
   CONGRATULATIONS → TREASURE PAGE
========================================================= */

let treasurePageOpened = false;

function goToTreasurePage(event){

    if(event){
        event.preventDefault();
        event.stopPropagation();
    }

    /* Only allow this after the spider has been caught */
    if(!gameOver || treasurePageOpened) return;

    treasurePageOpened = true;

    /* Hide the congratulations message */
    congratulationsTitle.classList.remove("show");

    congratulationsTitle.style.opacity = "0";
    congratulationsTitle.style.visibility = "hidden";
    congratulationsTitle.style.pointerEvents = "none";

    /* Hide the first page */
    scene.classList.add("page-hidden");

    /* Show the treasure page */
    setTimeout(() => {
        treasurePage.classList.add("active");
    }, 350);
}


/*
   Clicking directly on "Congratulations!"
*/
congratulationsTitle.addEventListener(
    "click",
    goToTreasurePage
);


/*
   Fallback:
   After the spider is caught, any click on the
   congratulations screen will move to Page 2.

   This makes the transition reliable even if the
   SVG/text itself does not receive the click.
*/
document.addEventListener(
    "click",
    function(event){

        if(
            gameOver &&
            congratulationsTitle.classList.contains("show") &&
            !treasurePageOpened
        ){
            goToTreasurePage(event);
        }

    }
);

/* =========================================================
   DIRECT ACCESS — index.html#treasure
========================================================= */

function openTreasurePageFromHash(){

    if(window.location.hash === "#treasure"){

        scene.classList.add("page-hidden");
        treasurePage.classList.add("active");

    }
}

openTreasurePageFromHash();

/* =========================================================
   TREASURE CHEST
========================================================= */

function openTreasure(event){

    event.stopPropagation();

    hiddenTreasure.classList.add("found");
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        spiderX =
            Math.min(
                spiderX,
                window.innerWidth - 75
            );


        spiderY =
            Math.min(
                spiderY,
                window.innerHeight - 75
            );

    }
);

</script>
