<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 500 300"
    width="500"
    height="300"
>
    <!-- =====================================================
         PIRATE SHIP
         ===================================================== -->

    <!-- Sail -->
    <path
        d="M245 45
           C310 70 355 105 375 145
           L245 145
           Z"
        fill="#f4e8c1"
        stroke="#241b12"
        stroke-width="5"
    />

    <!-- Mast -->
    <rect
        x="238"
        y="35"
        width="12"
        height="150"
        rx="5"
        fill="#4a2c17"
    />

    <!-- Pirate flag -->
    <path
        d="M250 35
           C280 25 310 30 330 45
           C305 55 280 52 250 62
           Z"
        fill="#111111"
        stroke="#000000"
        stroke-width="3"
    />

    <!-- Skull -->
    <circle
        cx="288"
        cy="43"
        r="9"
        fill="#ffffff"
    />

    <circle
        cx="284"
        cy="41"
        r="2.5"
        fill="#111111"
    />

    <circle
        cx="292"
        cy="41"
        r="2.5"
        fill="#111111"
    />

    <path
        d="M282 47 L294 47"
        stroke="#111111"
        stroke-width="2"
    />


    <!-- =====================================================
         SHIP BODY
         ===================================================== -->

    <path
        d="M75 165
           C120 185 170 195 250 195
           C330 195 395 180 430 160
           L405 225
           C300 255 180 255 100 225
           Z"
        fill="#6b351c"
        stroke="#26150d"
        stroke-width="7"
    />

    <!-- Upper deck -->
    <path
        d="M100 160
           L395 160
           L415 180
           L85 180
           Z"
        fill="#9a5428"
        stroke="#26150d"
        stroke-width="5"
    />


    <!-- =====================================================
         CABIN
         ===================================================== -->

    <path
        d="M315 105
           L390 105
           L400 160
           L305 160
           Z"
        fill="#75401f"
        stroke="#26150d"
        stroke-width="5"
    />

    <!-- Cabin window -->
    <circle
        cx="355"
        cy="130"
        r="14"
        fill="#74c7df"
        stroke="#26150d"
        stroke-width="5"
    />


    <!-- =====================================================
         BOW DETAIL
         ===================================================== -->

    <path
        d="M405 160
           L455 155
           L420 185
           Z"
        fill="#8d4a23"
        stroke="#26150d"
        stroke-width="5"
    />


    <!-- =====================================================
         WATER
         ===================================================== -->

    <path
        d="M40 235
           C90 215 140 250 190 230
           C240 210 290 250 340 230
           C390 210 440 245 470 230"
        fill="none"
        stroke="#79d7ef"
        stroke-width="8"
        stroke-linecap="round"
        opacity="0.8"
    />

    <path
        d="M80 255
           C125 240 165 270 210 250
           C255 230 300 270 345 250
           C390 235 425 260 455 250"
        fill="none"
        stroke="#ffffff"
        stroke-width="4"
        stroke-linecap="round"
        opacity="0.4"
    />

</svg>